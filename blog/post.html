<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>lazyming</title>
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,600;1,400;1,600&family=Source+Serif+4:opsz,wght@8..60,600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/blog.css" />
  <!-- Syntax highlighting (one of the two is disabled at runtime by theme.js) -->
  <link rel="stylesheet" data-theme-light href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.10.0/build/styles/github.min.css" />
  <link rel="stylesheet" data-theme-dark  href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.10.0/build/styles/github-dark.min.css" disabled />
  <!-- Set theme before paint to avoid flash of wrong theme -->
  <script>
    try {
      if (sessionStorage.getItem('lm_theme') === 'night') {
        document.documentElement.setAttribute('data-theme', 'night');
      }
    } catch (e) {}
  </script>
</head>
<body>

<div class="page">

  <header class="top">
    <a class="brand" href="../index.html">lazyming</a>
    <button type="button" class="theme-toggle" data-theme-toggle><span data-when-day>Dark mode</span><span data-when-night>Light mode</span></button>
  </header>

  <main>
    <a class="back" href="../index.html#writing">← All writing</a>

    <header class="post-head">
      <div class="post-meta">
        <time id="postDate"></time>
        <div class="tags" id="postTags"></div>
      </div>
      <h1 class="post-title" id="postTitle">Loading…</h1>
      <p class="post-dek" id="postDek"></p>
    </header>

    <article id="postContent">
      <p class="muted">Loading…</p>
    </article>
  </main>

  <footer>
    <span>© 2026 lazyming</span>
    <span>“At least I tried. :D”</span>
  </footer>

</div>

<script src="../js/theme.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.10.0/build/highlight.min.js"></script>
<script src="../js/blog-post.js"></script>
</body>
</html>
